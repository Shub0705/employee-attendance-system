apiVersion: apps/v1
kind: Deployment
metadata:
  name: Employe-frontend
  namespace: job
  labels:
    global: logic
spec:
  replicas: 1
  selector: 
  matchLabels:
    global: logic
  tamplate:
    metadata:
      name: Employe-frontend
      labels:
        global: logic
    spec:
      containers:
        - name: Employee_f
          image: shubhamdoc0705/frontend:latest
          port:
            containerPort: 80
