apiVersion: apps/v1
kind: Deployment
metadata:
  name: employe-frontend
  namespace: job
  labels:
    global: logic
spec:
  replicas: 1
  selector: 
    matchLabels:
      global: logic
  template:
    metadata:
      name: employe-frontend
      labels:
        global: logic
    spec:
      containers:
        - name: employe-f
          image: shubhamdoc0705/frontend:latest
          ports:
           - containerPort: 80
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: employe-backend
  namespace: job
  labels:
    global: logic-b
spec: 
  replicas: 1
  selector:
    matchLabels:
      global: logic-b
  template:
    metadata:
      name: employe-backend
      labels:
        global: logic-b
    spec: 
      containers:
        - name: employee-b
          image: shubhamdoc0705/backend:latest
          ports:
            - containerPort: 5000
